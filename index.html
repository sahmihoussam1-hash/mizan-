<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mizan — Bijouterie Al Andalous</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Mizan- Al Andalous</h1>
        
        <div class="controls">
            <label for="currency">Devise : </label>
            <select id="currency">
                <option value="MAD">MAD</option>
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
            </select>
            <button id="refresh-btn">Actualiser</button>
        </div>

        <div id="status" class="error"></div>

       
        <div id="prices-container">
            <p>Chargement des cours...</p>
        </div>

        
        <div class="card">
            <h3>Estimateur de bijou (Salma)</h3>
            <div class="form-group">
                <label for="weight">Poids (g) : </label>
                <input type="number" id="weight" placeholder="Ex: 10" min="0" step="0.01">
            </div>
            <p>Valeur estimée : <span id="estimate">0.00</span></p>
            <p id="estimator-error" class="error"></p>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
